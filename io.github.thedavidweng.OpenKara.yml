app-id: io.github.thedavidweng.OpenKara
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: openkara
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/openkara/cargo
    CARGO_NET_OFFLINE: "true"
    XDG_CACHE_HOME: /run/build/openkara/.cache
modules:
  - name: openkara
    buildsystem: simple
    build-commands:
      - mkdir -p .cargo
      - printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "cargo/vendor"\n' > .cargo/config.toml
      - sh -c 'mkdir -p src-tauri/generated/onnxruntime && runtime_path="$(find src-tauri/generated/onnxruntime-source -name "libonnxruntime.so*" ! -name "*providers*" ! -name "*.a" | sort | head -n 1)" && test -n "$runtime_path" && cp -f "$runtime_path" src-tauri/generated/onnxruntime/libonnxruntime.so && printf "{\"version\":\"v1.27.1\",\"target\":\"flatpak-linux\",\"sourceArchive\":\"flatpak-builder-source\"}\n" > src-tauri/generated/onnxruntime/manifest.json'
      # pnpm 12 is a native binary. Skip lifecycle scripts and optional
      # @pnpm/exe.* registry fetches; the matching linux exe archive is vendored
      # as pnpm-exe and copied over the shebang-less placeholder bin.
      - npm install -g --prefix /run/build/openkara/pnpm-install --ignore-scripts --no-optional ./pnpm-package
      - install -Dm0755 pnpm-exe/pnpm /run/build/openkara/pnpm-install/lib/node_modules/pnpm/pnpm
      # Point every lockfile resolution at the already-downloaded file: tarballs
      # so fetch/install use the localTarball fetcher. Registry URLs are
      # unreachable inside the sandbox (EAI_AGAIN).
      - node flatpak-node/rewrite_lockfile_local_tarballs.mjs
      # pnpm 12 still indexes the store under store-dir/v11. fetch writes that
      # layout with the native extractor; dist/worker.js does not ship anymore.
      - PATH="/run/build/openkara/pnpm-install/bin:$PATH" pnpm fetch --offline --trust-lockfile
      # --trust-lockfile: pnpm re-applies supply-chain policy (minimumReleaseAge /
      # trustPolicy) by fetching registry metadata even with --offline; that needs
      # network and fails inside the Flatpak sandbox (EAI_AGAIN). The lockfile is
      # already integrity-pinned via flatpak-node sources — safe to trust here.
      - PATH="/run/build/openkara/pnpm-install/bin:$PATH" pnpm install --offline --frozen-lockfile --trust-lockfile
      - PATH="/run/build/openkara/pnpm-install/bin:$PATH" pnpm tauri build --config packaging/flatpak/tauri.flatpak.conf.json --no-bundle
      - install -Dm0755 src-tauri/target/release/openkara ${FLATPAK_DEST}/bin/openkara
      - mkdir -p "${FLATPAK_DEST}/bin" && install -m0755 source-runtime/bin/node "${FLATPAK_DEST}/bin/openkara-source-node"
      - install -Dm0644 src-tauri/generated/onnxruntime/libonnxruntime.so ${FLATPAK_DEST}/lib/openkara/onnxruntime/libonnxruntime.so
      - mkdir -p "${FLATPAK_DEST}/share/licenses/io.github.thedavidweng.OpenKara/source-runtime" && install -m0644 source-runtime/LICENSE "${FLATPAK_DEST}/share/licenses/io.github.thedavidweng.OpenKara/source-runtime/LICENSE"
      - install -Dm0644 src-tauri/generated/onnxruntime-source/LICENSE.onnxruntime ${FLATPAK_DEST}/share/licenses/io.github.thedavidweng.OpenKara/onnxruntime/LICENSE
      - install -Dm0644 LICENSE ${FLATPAK_DEST}/share/licenses/io.github.thedavidweng.OpenKara/LICENSE
      - install -Dm0644 packaging/flatpak/io.github.thedavidweng.OpenKara.desktop ${FLATPAK_DEST}/share/applications/io.github.thedavidweng.OpenKara.desktop
      - install -Dm0644 packaging/flatpak/io.github.thedavidweng.OpenKara.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.thedavidweng.OpenKara.metainfo.xml
      - install -Dm0644 src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.thedavidweng.OpenKara.png
      - install -Dm0644 src-tauri/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.thedavidweng.OpenKara.png
    sources:
      - type: archive
        url: https://github.com/thedavidweng/OpenKara/archive/refs/tags/v0.18.1.tar.gz
        sha256: 588b4f2f7f3a858103352da628ccc101ab0e819323618f21b8cc85cf4cb01f96
        strip-components: 1
      - cargo-sources.json
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-12.15.0.tgz
        sha256: f5173f6127cc505cdb36ec17719fe54a8511c6fd8560c7ceb4bf7c73e3b4458b
        dest: pnpm-package
        strip-components: 1
      - type: archive
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.15.0.tgz
        sha256: 402f7045b1e0587acb1542f18d38afbccb6babf3c7451394e6fb3d9f0160c6ca
        dest: pnpm-exe
        strip-components: 1
        only-arches:
          - x86_64
      - type: archive
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.15.0.tgz
        sha256: 8117d65f28e627e949d5fc65d63342266326826a56fa374317bf13fe1166a50e
        dest: pnpm-exe
        strip-components: 1
        only-arches:
          - aarch64
      # ONNX Runtime archives come from the openkara-models catalog snapshot;
      # the renderer injects the URL and digest so no version is hand-pinned
      # here. The catalog archives are flat (no directory prefix).
      - type: archive
        url: https://github.com/thedavidweng/openkara-models/releases/download/infra-2026-08-12-001/onnxruntime-1.27.1-openkara-x86_64-unknown-linux-gnu-reduced.tar.gz
        sha256: fc71dfb273978b8cf4cc5e84df091a4ee0712d681d27487ca4c4e3083def27eb
        strip-components: 0
        dest: src-tauri/generated/onnxruntime-source
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/thedavidweng/openkara-models/releases/download/infra-2026-08-12-001/onnxruntime-1.27.1-openkara-aarch64-unknown-linux-gnu-reduced.tar.gz
        sha256: fa5c87a357ade6360ef39d9bfdac941af6664cb058202a4aa2b9cfc9e171008e
        strip-components: 0
        dest: src-tauri/generated/onnxruntime-source
        only-arches:
          - aarch64
      - node-sources.0.json
      - type: archive
        url: https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.gz
        sha256: eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c
        dest: source-runtime
        only-arches:
          - x86_64
      - type: archive
        url: https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-arm64.tar.gz
        sha256: 33c37be234ba8bee041961047b19160f4d7d0f164e8e246f78bdd10feff148b3
        dest: source-runtime
        only-arches:
          - aarch64
